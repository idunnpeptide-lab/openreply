name: Mobile Studio prototype checks

on:
  pull_request:
    branches:
      - feat/replyhalo-mcp-byo-ai-v1
    paths:
      - "services/mobile-studio/**"
      - "app/api/mobile-studio/**"
      - "app/(dashboard)/trend-watch/mobile-studio/**"
      - "components/mobile-studio-client.tsx"
      - "components/trend-watch-subnav.tsx"
      - "lib/mcp/**"
      - ".github/workflows/mobile-studio.yml"
  workflow_dispatch:

jobs:
  mobile-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-build
          CRON_SECRET: test-secret-for-ci-cron
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RESEND_API_KEY: re_test
          EMAIL_FROM: "ReplyHalo <login@ci.replyhalo.test>"
          META_GRAPH_API_VERSION: v25.0
          INSTAGRAM_APP_ID: test
          INSTAGRAM_APP_SECRET: test
          FACEBOOK_APP_SECRET: test
          WEBHOOK_VERIFY_TOKEN: test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/mobile-studio/requirements.txt httpx==0.28.1 pytest==8.3.5
      - run: python -m pytest -q test_gateway.py test_agent_workflow.py
        working-directory: services/mobile-studio
