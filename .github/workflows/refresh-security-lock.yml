name: Refresh security dependency lock

on:
  push:
    branches:
      - security/hardening-phase-1

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.head_commit.message != 'Refresh dependency lock after audit fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/hardening-phase-1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Verify critical vulnerabilities are removed
        run: npm audit --package-lock-only --audit-level=critical
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh dependency lock after audit fix"
          git push origin HEAD:security/hardening-phase-1
